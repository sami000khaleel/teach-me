# ===================================================================
# TeachMe — Docker Compose stack
#   - mysql  : relational data
#   - mongo  : session / log data
#   - server : Node backend + serves the built React frontend
# ===================================================================

services:
  # ===================================================================
  # MySQL
  # ===================================================================
  mysql:
    image: mysql:8.0
    container_name: teachme-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount the WHOLE db folder — MySQL runs every .sql alphabetically.
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - teachme

  # ===================================================================
  # MongoDB
  # ===================================================================
  mongo:
    image: mongo:7.0
    container_name: teachme-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?MONGO_INITDB_DATABASE is required}
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - teachme

  # ===================================================================
  # Server — Node backend + serves built React frontend
  # ===================================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachme-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}

      # ---- MySQL (service name + internal port) ----
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

      # ---- MongoDB — full URI, no host/port juggling ----
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin

      # ---- AI ----
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:5000}

      # ---- CORS ----
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}

      # ---- HTTPS (off inside Docker) ----
      USE_HTTPS: "false"

      # ---- Email ----
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server/images:/app/images
      - ./server/lectures:/app/lectures
      - ./server/snapshots:/app/snapshots
    networks:
      - teachme

# ===================================================================
# Named volumes
# ===================================================================
volumes:
  mysql_data:
  mongo_data:

# ===================================================================
# Networks
# ===================================================================
networks:
  teachme:
    driver: bridge